<style>

  }

      --ground:#06202e; --card:#0c2b3c; --line:#17405a; --line-2:#255a76;
      --ink:#e8f1f7; --ink-soft:#b9d5e5; --muted:#8fb3c9; --chip:#123a4f; --chip-2:#1a4a63;
      --head-bg:#021826; --head-fg:#ffffff; --head-muted:#8fb3c9; --head-line:#0f3346;
      --crim-lt:#3a1420; --gN:#2a4d61; --gN-fg:#b9d5e5;
      --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --ground:#06202e; --card:#0c2b3c; --line:#17405a; --line-2:#255a76;
    --ink:#e8f1f7; --ink-soft:#b9d5e5; --muted:#8fb3c9; --chip:#123a4f; --chip-2:#1a4a63;
    --head-bg:#021826; --head-fg:#ffffff; --head-muted:#8fb3c9; --head-line:#0f3346;
    --crim-lt:#3a1420; --gN:#2a4d61; --gN-fg:#b9d5e5;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
  a{color:var(--crim)}
  a:hover{color:var(--crim-dk)}
  :focus-visible{outline:2px solid var(--crim);outline-offset:2px}
  button{font:inherit;color:inherit}

  /* Reiter, nur sichtbar bei mehreren Listen in einer Datei */
  .tabs{background:var(--head-bg);border-bottom:1px solid var(--head-line)}
  .tabs-in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;gap:0 2px}
  .tab{flex:0 0 auto;border:0;background:none;padding:13px 14px 11px;border-bottom:3px solid transparent;font-family:var(--f-disp);font-size:13.5px;font-weight:500;color:var(--head-muted);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .tab:hover{color:var(--head-fg)}
  .tab[aria-selected="true"]{color:var(--head-fg);border-bottom-color:var(--crim)}
  .tab .n{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--head-muted)}
  .tab[aria-selected="true"] .n{background:var(--crim);color:#fff}
  .tab:focus-visible{outline-offset:-3px}

  /* Kopf */
  .top{background:var(--head-bg);color:var(--head-fg);border-bottom:1px solid var(--head-line)}
  .top-in{max-width:1180px;margin:0 auto;padding:22px 24px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:18px 32px;align-items:end}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--crim);box-shadow:0 0 0 4px rgba(209,44,82,.22)}
  .listname{font-family:var(--f-disp);font-weight:500;font-size:26px;line-height:1.15;text-wrap:balance}
  .listsub{color:var(--head-muted);font-size:13px;margin-top:4px;font-family:var(--f-disp);letter-spacing:.02em}
  .counts{display:flex;gap:8px;flex-wrap:wrap}
  .count{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 10px 5px;border-radius:8px;font-family:var(--f-disp)}
  .count b{font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .count span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-top:3px}

  /* Werkzeuge */
  .tools{max-width:1180px;margin:0 auto;padding:16px 24px 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1 1 260px;min-width:200px;position:relative}
  .search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);color:var(--ink);font-family:var(--f-disp);font-size:14px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip-btn{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 13px;font-family:var(--f-disp);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
  .chip-btn i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .chip-btn[aria-pressed="true"]{border-color:var(--crim);background:var(--crim-lt);color:var(--crim-dk)}
  :root[data-theme="dark"] .chip-btn[aria-pressed="true"],
  .chip-btn[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--crim)}
  select{padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);color:var(--ink);font-family:var(--f-disp);font-size:13px}
  .load{border:1px dashed var(--line-2);background:var(--card);border-radius:8px;padding:8px 12px;font-family:var(--f-disp);font-size:13px;cursor:pointer;color:var(--ink-soft);display:inline-flex;gap:8px;align-items:center}
  .load:hover{border-color:var(--crim);color:var(--crim-dk)}
  .load input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
  .legend{max-width:1180px;margin:0 auto;padding:4px 24px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-disp);font-size:12px;color:var(--muted);letter-spacing:.02em;align-items:center}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}
  .legend .grp-key{display:inline-flex;gap:6px;align-items:center}
  .legend .grp-key b{font-weight:600;color:var(--ink-soft)}
  .result{max-width:1180px;margin:0 auto;padding:0 24px 8px;font-family:var(--f-disp);font-size:13px;color:var(--muted)}

  /* Liste */
  main{max-width:1180px;margin:0 auto;padding:0 24px 48px;display:flex;flex-direction:column;gap:6px}
  .co{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;border-left:4px solid transparent}
  .co.open{border-left-color:var(--crim)}
  .co-head{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:10px 14px 10px 12px;background:none;border:0;text-align:left;cursor:pointer}
  .co-head:hover{background:var(--chip)}
  .co.open .co-head{background:var(--chip)}
  .badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:15px}
  .co-name{font-family:var(--f-disp);font-weight:500;font-size:15.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .co-ort{font-family:var(--f-disp);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 22px}

  .fact.wide{grid-column:1 / -1}

  .contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 18px}
  .person{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--line)}
  .person .role{font-family:var(--f-disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .person .name{font-size:14.5px}
  .person .links{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-disp);font-size:12.5px}
  .person .li.muted{color:var(--muted)}
  .person .li.sn{color:var(--ink-soft)}
  .person .li.sn:hover{color:var(--crim)}
  .crit-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px 26px}
  .crit{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;padding:7px 0;border-bottom:1px dotted var(--line)}
  .crit:last-child{border-bottom:0}
  .crit .chip{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:12.5px;margin-top:1px}
  .crit .n{font-family:var(--f-disp);font-size:14px;font-weight:500;color:var(--ink)}
  .crit .n code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:6px}
  .crit .why{grid-column:2;font-size:13.5px;color:var(--ink-soft);margin:0;max-width:62ch}

  .g-A{background:var(--gA);color:var(--gA-fg)} .g-B{background:var(--gB);color:var(--gB-fg)}
  .g-C{background:var(--gC);color:var(--gC-fg)} .g-D{background:var(--gD);color:var(--gD-fg)}
  .g-N{background:var(--gN);color:var(--gN-fg)}

  .empty{padding:40px;text-align:center;color:var(--muted);font-family:var(--f-disp)}
  .drop{position:fixed;inset:0;background:rgba(0,47,69,.72);color:#fff;display:none;place-items:center;font-family:var(--f-disp);font-size:22px;z-index:9;pointer-events:none}
  .drop.on{display:grid}
  .drop div{border:2px dashed #fff;border-radius:14px;padding:32px 48px}
  footer{max-width:1180px;margin:0 auto;padding:0 24px 40px;font-family:var(--f-disp);font-size:12px;color:var(--muted)}

  @media (max-width:760px){
    .top-in{grid-template-columns:1fr;align-items:start}
    .co-head{grid-template-columns:34px 1fr auto}
    .co-ort{display:none}
    .strip{grid-column:1 / -1;flex-wrap:wrap}
    .co-body{padding-left:14px}
  }
  @media (prefers-reduced-motion: reduce){ .caret{transition:none} }

  var state={headers:[],rows:[],meta:{},S:null,filter:'ALL',sort:'pts-desc',q:''};
  try{var saved=JSON.parse(localStorage.getItem('icp-radar')||'{}');if(saved.filter)state.filter=saved.filter;if(saved.sort)state.sort=saved.sort;}catch(e){}
  function persist(){try{localStorage.setItem('icp-radar',JSON.stringify({filter:state.filter,sort:state.sort}));}catch(e){}}

  function load(headers,rows,meta){
    state.headers=headers;state.rows=rows;state.meta=meta||{};state.S=analyze(headers);
    var c=state.S.col;
    state.items=rows.map(function(r,idx){
      return {r:r,idx:idx,name:r[c.firma]||'',grade:G(r[c.gesamt]),pts:parseFloat(String(r[c.punkte]||'').replace(',','.'))||0,
        hay:((r[c.firma]||'')+' '+(c.ort>=0?r[c.ort]:'')+' '+(c.seg>=0?r[c.seg]:'')).toLowerCase()};
    });
    renderHead();renderLegend();renderList();
  }
  function renderHead(){
    var m=state.meta;
    document.getElementById('listName').textContent=m.title||'ICP-Liste';
    var sub=[state.rows.length+' Firmen'];
    if(m.source)sub.push('Quelle: '+m.source);
    if(m.generated)sub.push('Stand '+m.generated);
    document.getElementById('listSub').textContent=sub.join(' · ');
    var cnt={A:0,B:0,C:0,D:0,N:0};state.items.forEach(function(it){cnt[it.grade]++;});
    var lab={A:'Starker Fit',B:'Guter Fit',C:'Bedingt',D:'Schlechter Fit'};
    document.getElementById('counts').innerHTML=['A','B','C','D'].map(function(g){
      return '<div class="count g-'+g+'"><b>'+cnt[g]+'</b><span>'+g+' · '+lab[g]+'</span></div>';}).join('');
    var gf=document.getElementById('gradeFilter');
    gf.innerHTML=[['ALL','Alle',null],['A','A','A'],['B','B','B'],['C','C','C'],['D','D','D']].map(function(x){
      return '<button class="chip-btn" data-g="'+x[0]+'" aria-pressed="'+(state.filter===x[0])+'">'+(x[2]?'<i class="g-'+x[2]+'"></i>':'')+x[1]+'</button>';}).join('');
    document.getElementById('sort').value=state.sort;
    document.getElementById('foot').textContent='Noten je Kriterium: A erfüllt, B überwiegend, C teilweise oder nicht belegbar, D nicht erfüllt. Bei Anti-ICP-Kriterien heißt A, dass das Ausschlussmerkmal nicht zutrifft. Ein C ist ein Prüfauftrag, keine Absage. Gesamtpunkte: ab 80 starker Fit, ab 60 guter Fit, ab 40 bedingter Fit, darunter schlechter Fit.';
  }
  function renderLegend(){
    var byG={};state.S.crit.forEach(function(k){byG[k.grp]=(byG[k.grp]||0)+1;});
    var groups=GRP_ORDER.filter(function(g){return byG[g];}).map(function(g){return '<span class="grp-key"><b>'+g+'</b>'+GRP[g]+' ('+byG[g]+')</span>';}).join('');
    document.getElementById('legend').innerHTML='<span><i class="g-A"></i>A</span><span><i class="g-B"></i>B</span><span><i class="g-C"></i>C</span><span><i class="g-D"></i>D</span><span><i class="g-N"></i>ohne Wert</span><span style="opacity:.5">|</span>'+groups;
  }
  function visible(){
    var q=state.q.trim().toLowerCase();
    var list=state.items.filter(function(it){return (state.filter==='ALL'||it.grade===state.filter)&&(!q||it.hay.indexOf(q)>=0);});
    if(state.sort==='pts-desc')list.sort(function(a,b){return b.pts-a.pts||a.name.localeCompare(b.name,'de');});
    else if(state.sort==='pts-asc')list.sort(function(a,b){return a.pts-b.pts||a.name.localeCompare(b.name,'de');});
    else list.sort(function(a,b){return a.name.localeCompare(b.name,'de');});
    return list;
  }
  function stripHTML(r){
    var S=state.S,out='';
    GRP_ORDER.forEach(function(g){
      var ks=S.crit.filter(function(k){return k.grp===g;});if(!ks.length)return;
      out+='<span class="g">'+ks.map(function(k){var v=G(r[k.i]);return '<i class="c g-'+v+'" title="'+esc(k.code+' '+k.name+': '+(v==='N'?'ohne Wert':v))+'"></i>';}).join('')+'</span>';
    });
    return out;
  }
  function renderList(){
    var list=visible(),c=state.S.col,main=document.getElementById('list');
    document.getElementById('result').textContent=list.length===state.items.length?state.items.length+' Firmen':list.length+' von '+state.items.length+' Firmen';
    if(!list.length){main.innerHTML='<div class="empty">Keine Firma passt zu Filter und Suche.</div>';return;}
    main.innerHTML=list.map(function(it){var r=it.r;
      return '<article class="co" data-idx="'+it.idx+'"><button class="co-head" aria-expanded="false">'+
        '<span class="badge g-'+it.grade+'">'+(it.grade==='N'?'–':it.grade)+'</span>'+
        '<span class="co-name">'+esc(it.name)+'</span>'+
        '<span class="co-ort">'+esc(c.ort>=0?r[c.ort]:'')+'</span>'+
        '<span class="co-pts"><b>'+esc(c.punkte>=0?r[c.punkte]:'')+'</b> Pkt.</span>'+
        '<span class="strip">'+stripHTML(r)+'<svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>'+
        '</button><div class="co-body" hidden></div></article>';}).join('');
  }
  function fact(k,v,opts){opts=opts||{};
    var inner;
    if(v==null||String(v).trim()==='')inner='<span class="v muted">keine Angabe</span>';
    else if(opts.link&&isUrl(v))inner='<span class="v"><a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(opts.text||v.replace(/^https?:\/\/(www\.)?/,''))+'</a></span>';
    else if(opts.pill)inner='<span class="v"><span class="pill g-'+opts.pill(v)+'">'+esc(v)+'</span></span>';
    else if(opts.mutedIf&&opts.mutedIf.test(v))inner='<span class="v muted">'+esc(v)+'</span>';
    else inner='<span class="v">'+esc(v)+'</span>';
    return '<div class="fact'+(opts.wide?' wide':'')+'"><span class="k">'+esc(k)+'</span>'+inner+'</div>';
  }
  function detailHTML(r){
    var S=state.S,c=S.col,h='';
    h+='<div class="facts">';
    if(c.website>=0)h+=fact('Website',r[c.website],{link:true,mutedIf:/^keine/i});
    if(c.ort>=0)h+=fact('Ort',r[c.ort]);
    if(c.einst>=0)h+=fact('Einstufung',r[c.einst],{pill:einstG});
    if(c.punkte>=0)h+=fact('Punkte',r[c.punkte],{pill:ptsG});
    if(c.dq>=0)h+=fact('Datenqualität',r[c.dq],{pill:dqG});
    if(c.quelle>=0)h+=fact('Quelle',r[c.quelle]);
    if(c.liFirma>=0)h+=fact('LinkedIn Firmenprofil',r[c.liFirma],{link:true,mutedIf:/^nicht/i});
    var snF=snShort(r[c.firma]);var snCo=(c.snFirma>=0&&isUrl(r[c.snFirma])&&String(r[c.snFirma]).indexOf('/sales/search/company')>=0)?r[c.snFirma]:snCoUrl('"'+snF+'"');h+=fact('Sales Navigator',snCo,{link:true,text:'Firmensuche "'+snF+'"'});
    if(c.seg>=0)h+=fact('Segmente',r[c.seg],{wide:true});
    if(c.ausschl>=0)h+=fact('Ausschlussgrund',r[c.ausschl],{wide:true,mutedIf:/^kein/i});
    if(c.kurz>=0)h+=fact('Kurzbegründung',r[c.kurz],{wide:true});
    h+='</div>';
    if(S.contacts.length){
      var ps=S.contacts.filter(function(p){return String(r[p.i]||'').trim();});
      if(ps.length){
        h+='<div><h4 class="sec-h">Ansprechpartner</h4><div class="contacts">'+ps.map(function(p){
          var name=r[p.i],li=p.li>=0?r[p.li]:'',fn=snShort(r[c.firma]);
          var liH=isUrl(li)?'<a class="li" href="'+esc(li)+'" target="_blank" rel="noopener">LinkedIn-Profil</a>':(li?'<span class="li muted">'+linkify(li)+'</span>':'');
          var names=personNames(name);
          var snH=names.map(function(n){var kw=n+' '+fn;return '<a class="li sn" href="'+esc(snUrl(kw))+'" target="_blank" rel="noopener" title="Personensuche im Sales Navigator: '+esc(kw)+'">Sales Navigator'+(names.length>1?' ('+esc(n)+')':'')+'</a>';}).join('');
          return '<div class="person"><span class="role">'+esc(p.label)+'</span><span class="name'+(/^keine /i.test(name)?' muted':'')+'">'+esc(name)+'</span><span class="links">'+liH+snH+'</span></div>';}).join('')+'</div></div>';
      }
    }
    if(S.crit.length){
      h+='<div><h4 class="sec-h">ICP-Bewertung je Kriterium</h4><div class="crit-groups">';
      GRP_ORDER.forEach(function(g){var ks=S.crit.filter(function(k){return k.grp===g;});if(!ks.length)return;
        h+='<section><div class="sec-h" style="font-size:10.5px;color:var(--muted)">'+g+' · '+GRP[g]+'</div>'+ks.map(function(k){var v=G(r[k.i]);
          return '<div class="crit"><span class="chip g-'+v+'">'+(v==='N'?'–':v)+'</span><span class="n"><code>'+esc(k.code)+'</code>'+esc(k.name)+'</span><p class="why">'+esc(k.why>=0?r[k.why]:'')+'</p></div>';}).join('')+'</section>';
      });
      h+='</div></div>';
    }
    return h;
  }
  document.getElementById('list').addEventListener('click',function(e){
    var btn=e.target.closest('.co-head');if(!btn)return;
    var art=btn.parentNode,body=art.querySelector('.co-body'),open=art.classList.toggle('open');
    btn.setAttribute('aria-expanded',open);
    if(open&&!body.dataset.done){body.innerHTML=detailHTML(state.rows[+art.dataset.idx]);body.dataset.done='1';}
    body.hidden=!open;
  });
  document.getElementById('gradeFilter').addEventListener('click',function(e){
    var b=e.target.closest('.chip-btn');if(!b)return;state.filter=b.dataset.g;persist();
    Array.prototype.forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b);});renderList();
  });
  document.getElementById('sort').addEventListener('change',function(){state.sort=this.value;persist();renderList();});
  var qt;document.getElementById('q').addEventListener('input',function(){var v=this.value;clearTimeout(qt);qt=setTimeout(function(){state.q=v;renderList();},120);});

  function loadFile(file){
    if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){var rows=parseCSV(rd.result);if(rows.length<2){alert('Die Datei enthält keine Datenzeilen.');return;}
      var H=rows[0].map(function(x){return x.trim();});
      if(H.indexOf('Firma')<0){alert('Keine Spalte "Firma" gefunden. Erwartet wird eine ICP-Bewertungsliste.');return;}
      load(H,rows.slice(1),{title:file.name.replace(/\.csv$/i,''),source:file.name,generated:'im Browser geladen'});
      Array.prototype.forEach.call(document.getElementById('tabsIn').children,function(t){t.setAttribute('aria-selected','false');});
      window.scrollTo({top:0});};
    rd.readAsText(file,'utf-8');
  }
  document.getElementById('file').addEventListener('change',function(){loadFile(this.files[0]);this.value='';});
  var drop=document.getElementById('drop'),dc=0;
  window.addEventListener('dragenter',function(e){e.preventDefault();dc++;drop.classList.add('on');});
  window.addEventListener('dragover',function(e){e.preventDefault();});
  window.addEventListener('dragleave',function(){dc--;if(dc<=0){dc=0;drop.classList.remove('on');}});
  window.addEventListener('drop',function(e){e.preventDefault();dc=0;drop.classList.remove('on');var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)loadFile(f);});

  var data={};
  try{data=JSON.parse(document.getElementById('icp-data').textContent||'{}');}catch(e){}
  /* Eine Liste: {meta,headers,rows}. Mehrere Listen: {datasets:[{tab:{label},meta,headers,rows},...]} mit Reiterleiste. */
  var sets=Array.isArray(data.datasets)?data.datasets.filter(function(d){return d&&d.headers&&d.rows;}):(data.headers&&data.rows?[data]:[]);
  var tabs=document.getElementById('tabs'),tabsIn=document.getElementById('tabsIn');
  function slug(s){return String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
  function showSet(i,setHash){
    var d=sets[i];if(!d)return;
    load(d.headers,d.rows,d.meta);
    Array.prototype.forEach.call(tabsIn.children,function(t,j){t.setAttribute('aria-selected',j===i);t.tabIndex=j===i?0:-1;});
    if(setHash){try{history.replaceState(null,'','#'+d.tab.id);}catch(e){}}
  }
  if(sets.length>1){
    sets.forEach(function(d,i){d.tab=d.tab||{};d.tab.label=d.tab.label||(d.meta&&d.meta.title)||('Liste '+(i+1));d.tab.id=d.tab.id||slug(d.tab.label.replace(/^\d+[\s.)-]*/,''))||String(i);});
    tabsIn.innerHTML=sets.map(function(d){return '<button class="tab" role="tab" id="tab-'+esc(d.tab.id)+'" aria-selected="false" tabindex="-1">'+esc(d.tab.label)+'<span class="n">'+d.rows.length+'</span></button>';}).join('');
    tabs.hidden=false;
    tabsIn.addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;showSet(Array.prototype.indexOf.call(tabsIn.children,b),true);window.scrollTo({top:0});});
    tabsIn.addEventListener('keydown',function(e){
      var i=Array.prototype.indexOf.call(tabsIn.children,document.activeElement);if(i<0)return;
      var n=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:e.key==='Home'?0:e.key==='End'?sets.length-1:-1;
      if(n<0||n>=sets.length)return;e.preventDefault();showSet(n,true);tabsIn.children[n].focus();});
    var h=location.hash.replace(/^#/,''),start=0;sets.forEach(function(d,i){if(d.tab.id===h)start=i;});
    showSet(start,false);
  }else if(sets.length===1)load(sets[0].headers,sets[0].rows,sets[0].meta);
  else document.getElementById('list').innerHTML='<div class="empty">Noch keine Liste geladen. Ziehe eine ICP-CSV auf die Seite oder nutze "CSV laden".</div>';
})();
}
</script>
